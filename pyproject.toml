[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sumy"
version = "0.13.0"
description = "Module for automatic summarization of text documents and HTML pages."
readme = "README.md"
license = { text = "Apache License, Version 2.0" }
authors = [
    { name = "Mišo Belica", email = "miso.belica@gmail.com" }
]
requires-python = ">=3.8"
keywords = [
    "data mining",
    "automatic summarization",
    "data reduction",
    "web-data extraction",
    "NLP",
    "natural language processing",
    "latent semantic analysis",
    "LSA",
    "TextRank",
    "LexRank",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Czech",
    "Natural Language :: English",
    "Natural Language :: French",
    "Natural Language :: German",
    "Natural Language :: Hebrew",
    "Natural Language :: Italian",
    "Natural Language :: Japanese",
    "Natural Language :: Polish",
    "Natural Language :: Portuguese",
    "Natural Language :: Slovak",
    "Natural Language :: Spanish",
    "Natural Language :: Swedish",
    "Natural Language :: Ukrainian",
    "Natural Language :: Greek",
    "Natural Language :: Arabic",
    "Natural Language :: Thai",
    "Topic :: Education",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Filters",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Text Processing :: Markup :: HTML",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "docopt-ng>=0.6.3",  # 0.6.1 was docopt's first release, docopt-ng's is 0.6.3
    "breadability>=0.1.20",
    "lxml-html-clean>=0.1.0",  # Required by breadability (lxml.html.clean was moved to separate package)
    # 2.32.4 is the release that fixes GHSA-9hjg-9r4m-mvj7, where a malicious redirect leaks
    # .netrc credentials. It is also the newest requests that still supports Python 3.8, as
    # 2.33.0 requires 3.10.
    "requests>=2.32.4",
    "pycountry>=18.2.23",
    # 3.9 evaluates wn.morphy at import time, so it cannot be imported without the wordnet
    # corpus. 3.10.1 blocks its own imports when the venv sits under the CWD.
    "nltk>=3.9.1,!=3.10.1",
    # Required by breadability for pkg_resources, which setuptools v82 deleted. Without the
    # cap, sumy.parsers.html fails outright when doing `import breadability`. Both bounds below
    # repeat the cap, so lifting it means editing both lines.
    # 70.0.0 fixes GHSA-cx63-2mw6-8hw5, a ReDoS in package_index.
    "setuptools>=70.0.0,<82",
    # 78.1.1 fixes GHSA-5rjg-fvgr-3xxf, a path traversal in PackageIndex, but is the first
    # release to require Python 3.9. Python 3.8 cannot reach it at all -- 75.3.4 is the last
    # setuptools that installs there -- so it keeps the lower floor above and stays exposed.
    "setuptools>=78.1.1,<82; python_version >= '3.9'",
]

[project.optional-dependencies]
LSA = ["numpy>=1.17.3"]
LexRank = ["numpy>=1.17.3"]
Japanese = ["tinysegmenter>=0.3"]
Chinese = ["jieba>=0.39"]
Korean = ["konlpy>=0.6.0"]  # earlier releases do not declare their JPype1 dependency
Hebrew = ["hebrew_tokenizer>=2.3.0"]
Greek = ["greek-stemmer-pos>=1.1.2"]  # 1.0.0 is missing the greek_stemmer.closets subpackage
Arabic = ["pyarabic>=0.6.14"]
Thai = ["pythainlp>=5.0.0"]
Polish = ["pystempel>=2.0.0"]

[tool.uv]
# Lock only for Python 3.10+. sumy still supports 3.8 and 3.9 (see requires-python above), but
# NLTK dropped them at 3.9.3, so a universal lock has to pin nltk 3.9.1/3.9.2 on those two
# interpreters and every NLTK advisory is unfixable there. Restricting the resolution keeps
# uv.lock -- the development environment -- on a patched nltk.
environments = ["python_version >= '3.10'"]

[dependency-groups]
dev = [
    # Earliest pair verified against this suite on Python 3.8, both plain and under --cov. Not
    # lower because pytest-cov 2.6.0 calls Function.get_marker, which pytest 4.0 removed, and
    # pytest 4.0.x cannot be installed at all alongside a current attrs.
    "pytest>=4.6.11",
    "pytest-cov>=2.6.1",
    "codecov>=2.1.13",
    "invoke>=2.0.0",
    # Requires Python>=3.9; only used interactively/in CI on a current interpreter (see
    # publish-to-pypi.yml), so it stays out of the resolution for the Python 3.8 environment.
    "bump-my-version>=1.5.1; python_version >= '3.9'",
]

[project.scripts]
sumy = "sumy.__main__:main"
sumy_eval = "sumy.evaluation.__main__:main"

[project.urls]
Homepage = "https://github.com/miso-belica/sumy"
Repository = "https://github.com/miso-belica/sumy"

[tool.hatch.build.targets.wheel]
packages = ["sumy"]

[tool.hatch.build.targets.sdist]
include = [
    "sumy/",
    "README.md",
    "LICENSE.md",
    "CHANGELOG.md",
]

[tool.bumpversion]
current_version = "0.13.0"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "sumy/__init__.py"

[[tool.bumpversion.files]]
filename = "tasks.py"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## Unreleased"
replace = """## Unreleased

## {new_version} ({now:%Y-%m-%d})"""

[[tool.bumpversion.files]]
filename = "uv.lock"
search = """name = "sumy"
version = "{current_version}"
source = {{ editable = "." }}"""
replace = """name = "sumy"
version = "{new_version}"
source = {{ editable = "." }}"""

[tool.isort]
multi_line_output = 5

[tool.ruff]
target-version = "py38"
line-length = 120

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
ignore = ["E501"]

# Ignore `E402` (import violations) in all `__init__.py` files, and in `_compat.py`.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"_compat.py" = ["F401"]

[tool.flake8]
ignore = ["S001", "D100"]
max-line-length = 160
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
