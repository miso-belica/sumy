name: Run tests
on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
  schedule:
    # Weekly, so tests-newest notices a dependency release that breaks sumy.
    - cron: "0 6 * * 1"

# Every job here only reads the checkout. Declared at the top level so a job added later
# starts read-only rather than silently inheriting the repository default.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Lint with ruff
        run: uvx ruff check --output-format=github .

  tests:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: "ubuntu-latest"
            python-version: "pypy3.10"
          - os: "ubuntu-latest"
            python-version: "graalpy"
          - os: "macos-latest"
            python-version: "3.12"
          - os: "windows-latest"
            python-version: "3.12"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: "Install lxml dev dependencies"
        if: ${{ startsWith(matrix.python-version, 'graalpy') && runner.os == 'Linux' }}
        run: sudo apt-get install libxml2-dev libxslt-dev python3-dev

      # uv.lock only covers Python 3.10+, see [tool.uv] environments in pyproject.toml. Python
      # 3.8 and 3.9 are still supported, so they install straight from pyproject.toml instead;
      # `uv pip install` cannot take --all-extras alongside a path, hence the explicit list.
      - name: "Install dependencies"
        shell: bash  # the windows runner defaults to PowerShell
        run: |
          if [ "${{ matrix.python-version }}" = "3.8" ] || [ "${{ matrix.python-version }}" = "3.9" ]; then
            uv venv --python "${{ matrix.python-version }}"
            uv pip install --group dev -e ".[LSA,LexRank,Japanese,Chinese,Korean,Hebrew,Greek,Arabic,Thai,Polish]"
          else
            uv sync --frozen --all-extras
          fi
          uv run --no-sync python -c "import nltk; nltk.download('punkt_tab')"

      - run: uv run --no-sync pytest tests --cov=sumy --cov-report=xml
        env:
          CI: 1
          PYTHONDONTWRITEBYTECODE: 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # sumy also has to keep working where it is not CPython on a normal operating system: PEP 783
  # made PyPI accept wheels for the PyEmscripten platform, so `micropip.install("sumy")` runs
  # in a browser. Nothing in the matrix above can catch a regression there -- the failure mode
  # is a dependency that cannot be resolved under Emscripten at all, which only shows up when
  # something actually resolves it. So this job installs the built wheel into a real Pyodide
  # runtime and summarizes a document through docs/demo/sumy-browser.mjs, the same module the
  # demo page uses.
  pyodide:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # No `uv python install`: `uv build` provisions its own interpreter, and nothing else in
      # this job runs Python -- the checks below run in node.
      - name: Build the wheel
        run: uv build --wheel

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/wasm/package-lock.json

      - name: Install Pyodide
        run: npm ci
        working-directory: tools/wasm

      # Two separate checks on purpose: the first fails when a dependency or an import breaks
      # under Emscripten, the second when summarizing itself does. Reading which one went red
      # is most of the diagnosis.
      - name: Check the wheel installs and imports under Pyodide
        run: node tools/wasm/check-wheel.mjs

      - name: Check summarizing works under Pyodide
        run: node tools/wasm/check-demo.mjs

  # The `tests` job above pins everything through uv.lock, so it only ever proves that one
  # point in the supported range works. This job resolves every direct dependency to the
  # oldest version pyproject.toml claims to accept, which is what a user gets when an older
  # release is already in their environment.
  #
  # Only on the oldest supported Python. A lower bound is a claim about the oldest dependency
  # version sumy works with, and that claim can only be exercised on an interpreter those
  # versions still install on: numpy alone needs 1.17.3 on 3.8 but 2.3.2 on 3.14, so pinning
  # to the floor on a newer interpreter measures wheel availability rather than sumy.
  #
  # Installs with `uv pip install` rather than `uv sync` on purpose. uv.lock is restricted to
  # Python 3.10+ (see [tool.uv] environments in pyproject.toml), so anything routed through the
  # lockfile cannot be synced onto 3.8 at all. Bypassing it is also the honest thing here: the
  # point of this job is to test what pyproject.toml declares, not what uv.lock pins.
  # https://docs.astral.sh/uv/concepts/resolution/#lowest-resolution
  tests-lowest-direct:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.8

      - name: "Install oldest declared dependencies"
        run: |
          uv venv --python 3.8
          uv pip install --resolution lowest-direct --all-extras -r pyproject.toml --group dev
          uv pip install --no-deps .
          uv run --no-project python -c "import nltk; nltk.download('punkt_tab')"

      - run: uv run --no-project pytest tests
        env:
          CI: 1
          PYTHONDONTWRITEBYTECODE: 1

  # `tests` installs from uv.lock, so it only ever sees one known-good set of versions and
  # never what `pip install sumy` actually resolves to for a new user. This job ignores the
  # lockfile and takes the newest release of everything. It is the check that would have
  # caught setuptools 82 deleting pkg_resources, which broke every fresh install while CI
  # stayed green on the pinned setuptools 68 in the lockfile.
  #
  # Skipped on pull requests: a breaking upstream release is not the fault of the PR that
  # happens to run next, and blocking unrelated work on it teaches people to ignore CI.
  tests-newest:
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: "Install newest available dependencies"
        run: |
          uv sync --upgrade --all-extras --python 3.14
          uv run --no-sync python -c "import nltk; nltk.download('punkt_tab')"

      - run: uv run --no-sync pytest tests
        env:
          CI: 1
          PYTHONDONTWRITEBYTECODE: 1
